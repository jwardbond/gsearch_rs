[package]
name = "gsearch"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
indicatif = "0.18.6"
kiddo = "6.3.0"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
